- id: q001
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "人生は一箱のマッチに似ている。重大に扱うのは莫迦莫迦しい。重大に扱わなければ危険である。"
  ruby: "[人生|じんせい] {は} [一箱|ひとはこ] の マッチ に [似|に] て いる 。 [重大|じゅうだい] に [扱|あつか]う の {は} [莫迦莫迦|ばかばか]しい 。 [重大|じゅうだい] に [扱|あつか]わ なけれ ば [危険|きけん] で ある 。"
  fr: "La vie ressemble à une boîte d'allumettes. La traiter avec sérieux est ridicule ; ne pas la traiter avec sérieux est dangereux."
  en: "Life is like a box of matches. Treating it seriously is absurd; not treating it seriously is dangerous."
- id: q002
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "自由は山巓の空気に似ている。どちらも弱い者には堪えることは出来ない。"
  ruby: "[自由|じゆう] {は} [山巓|さんてん] の [空気|くうき] に [似|に] て いる 。 どちら も [弱|よわ]い [者|もの] に {は} [堪|た]える こと {は} [出来|でき] ない 。"
  fr: "La liberté ressemble à l'air des cimes. Ni l'un ni l'autre ne sont supportables pour les faibles."
  en: "Freedom is like the air on a mountain peak. Neither can be borne by the weak."
- id: q003
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "あらゆる社交はおのずから虚偽を必要とするものである。"
  ruby: "あらゆる [社交|しゃこう] {は} おのずから [虚偽|きょぎ] を [必要|ひつよう] と する もの で ある 。"
  fr: "Toute vie sociale exige naturellement le mensonge."
  en: "All social life naturally requires falsehood."
- id: q004
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "人生を幸福にする為には、日常の瑣事を愛さなければならぬ。"
  ruby: "[人生|じんせい] を [幸福|こうふく] に する [為|ため] に {は} 、 [日常|にちじょう] の [瑣事|さじ] を [愛|あい]さ なけれ ば なら ぬ 。"
  fr: "Pour rendre la vie heureuse, il faut aimer les petites choses du quotidien."
  en: "To make life happy, one must love the trifles of everyday life."
- id: q005
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "最も賢い処世術は社会的因襲を軽蔑しながら、しかも社会的因襲と矛盾せぬ生活をすることである。"
  ruby: "[最|もっと]も [賢|かしこ]い [処世術|しょせいじゅつ] {は} [社会的|しゃかいてき] [因襲|いんしゅう] を [軽蔑|けいべつ] し ながら 、 しかも [社会的|しゃかいてき] [因襲|いんしゅう] と [矛盾|むじゅん] せ ぬ [生活|せいかつ] を する こと で ある 。"
  fr: "La conduite la plus sage est de mépriser les conventions sociales tout en vivant sans jamais les contredire."
  en: "The wisest way of living is to despise social conventions while leading a life that never contradicts them."
- id: q006
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "正義は武器に似たものである。"
  ruby: "[正義|せいぎ] {は} [武器|ぶき] に [似|に] た もの で ある 。"
  fr: "La justice ressemble à une arme."
  en: "Justice is like a weapon."
- id: q007
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "道徳の与えたる恩恵は時間と労力との節約である。"
  ruby: "[道徳|どうとく] の [与|あた]え たる [恩恵|おんけい] {は} [時間|じかん] と [労力|ろうりょく] と の [節約|せつやく] で ある 。"
  fr: "Le bienfait accordé par la morale est une économie de temps et d'effort."
  en: "The benefit morality grants is a saving of time and effort."
- id: q008
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "強者は道徳を蹂躙するであろう。弱者は又道徳に愛撫されるであろう。"
  ruby: "[強者|きょうしゃ] {は} [道徳|どうとく] を [蹂躙|じゅうりん] する で あろう 。 [弱者|じゃくしゃ] {は} [又|また] [道徳|どうとく] に [愛撫|あいぶ] さ れる で あろう 。"
  fr: "Les forts piétineront la morale. Les faibles, eux, en seront caressés."
  en: "The strong will trample morality. The weak, for their part, will be caressed by it."
- id: q009
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "人生は地獄よりも地獄的である。"
  ruby: "[人生|じんせい] {は} [地獄|じごく] より も [地獄|じごく] [的|てき] で ある 。"
  fr: "La vie est plus infernale que l'enfer."
  en: "Life is more hellish than hell."
- id: q010
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "我我の行為を決するものは善でもなければ悪でもない。唯我我の好悪である。"
  ruby: "[我我|われわれ] の [行為|こうい] を [決|けっ]する もの {は} [善|ぜん] で も なけれ ば [悪|あく] で も ない 。 [唯|ただ] [我我|われわれ] の [好悪|こうお] で ある 。"
  fr: "Ce qui décide de nos actes n'est ni le bien ni le mal, mais seulement nos goûts et nos dégoûts."
  en: "What decides our actions is neither good nor evil, but only our likes and dislikes."
- id: q011
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "わたしは良心を持っていない。わたしの持っているのは神経ばかりである。"
  ruby: "わたし {は} [良心|りょうしん] を [持|も]っ て い ない 。 わたし の [持|も]っ て いる の {は} [神経|しんけい] ばかり で ある 。"
  fr: "Je n'ai pas de conscience. Je n'ai que des nerfs."
  en: "I have no conscience. All I have is nerves."
- id: q012
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "眠りは死よりも愉快である。少くとも容易には違いあるまい。"
  ruby: "[眠|ねむ]り {は} [死|し] より も [愉快|ゆかい] で ある 。 [少|すくな]く とも [容易|ようい] に {は} [違|ちが]い ある まい 。"
  fr: "Le sommeil est plus agréable que la mort. Du moins, il est sans doute plus facile."
  en: "Sleep is more pleasant than death. At the very least, it must be easier."
- id: q013
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "河童"
  year: 1927
  source: https://www.aozora.gr.jp/cards/000879/card69.html
  text: "阿呆はいつも彼以外のものを阿呆であると信じている。"
  ruby: "[阿呆|あほう] {は} いつも [彼|かれ] [以外|いがい] の もの を [阿呆|あほう] で ある と [信|しん]じ て いる 。"
  fr: "L'imbécile croit toujours que tous les autres sont des imbéciles."
  en: "A fool always believes that everyone but himself is a fool."
- id: q014
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "他人を弁護するよりも自己を弁護するのは困難である。疑うものは弁護士を見よ。"
  ruby: "[他人|たにん] を [弁護|べんご] する より も [自己|じこ] を [弁護|べんご] する の {は} [困難|こんなん] で ある 。 [疑|うたが]う もの {は} [弁護士|べんごし] を [見|み]よ 。"
  fr: "Il est plus difficile de se défendre soi-même que de défendre autrui. Que ceux qui en doutent regardent les avocats."
  en: "Defending oneself is harder than defending others. Those who doubt it need only look at lawyers."
- id: q015
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "我々の信念を支配するものは常に捉え難い流行である。"
  ruby: "[我々|われわれ] の [信念|しんねん] を [支配|しはい] する もの {は} [常|つね] に [捉|とら]え [難|がた]い [流行|りゅうこう] で ある 。"
  fr: "Ce qui gouverne nos convictions est toujours une mode insaisissable."
  en: "What rules our beliefs is always an elusive fashion."
- id: q016
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "侏儒の言葉"
  year: 1923
  source: https://www.aozora.gr.jp/cards/000879/card158.html
  text: "人生は狂人の主催に成ったオリムピック大会に似たものである。"
  ruby: "[人生|じんせい] {は} [狂人|きょうじん] の [主催|しゅさい] に [成|な]っ た オリムピック [大会|たいかい] に [似|に] た もの で ある 。"
  fr: "La vie ressemble à des Jeux olympiques organisés par des fous."
  en: "Life is like an Olympic Games organised by madmen."
- id: q017
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "羅生門"
  year: 1915
  source: https://www.aozora.gr.jp/cards/000879/card127.html
  text: "下人の行方は、誰も知らない。"
  ruby: "[下人|げにん] の [行方|ゆくえ] {は} 、 [誰|だれ] も [知|し]ら ない 。"
  fr: "Où est allé le valet, nul ne le sait."
  en: "Where the servant went, no one knows."
- id: q018
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "蜘蛛の糸"
  year: 1918
  source: https://www.aozora.gr.jp/cards/000879/card92.html
  text: "ある日の事でございます。御釈迦様は極楽の蓮池のふちを、独りでぶらぶら御歩きになっていらっしゃいました。"
  ruby: "ある [日|ひ] の [事|こと] で ござい ます 。 [御釈迦|おしゃか] [様|さま] {は} [極楽|ごくらく] の [蓮池|はすいけ] の ふち を 、 [独|ひと]り で ぶらぶら [御|お] [歩|ある]き に なっ て いらっしゃい まし た 。"
  fr: "Cela se passa un jour. Le Bouddha flânait seul au bord de l'étang de lotus du paradis."
  en: "It happened one day. The Buddha was strolling alone along the lotus pond of paradise."
- id: q019
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "鼻"
  year: 1916
  source: https://www.aozora.gr.jp/cards/000879/card42.html
  text: "人間の心には互に矛盾した二つの感情がある。"
  ruby: "[人間|にんげん] の [心|こころ] に {は} [互|たがい] に [矛盾|むじゅん] し た [二|ふた] つ の [感情|かんじょう] が ある 。"
  fr: "Le cœur humain abrite deux sentiments qui se contredisent."
  en: "The human heart holds two feelings that contradict each other."
- id: q020
  author: 芥川竜之介
  authorLatin: Akutagawa Ryūnosuke
  work: "杜子春"
  year: 1920
  source: https://www.aozora.gr.jp/cards/000879/card43015.html
  text: "何になっても、人間らしい、正直な暮しをするつもりです"
  ruby: "[何|なに] に なっ て も 、 [人間|にんげん] らしい 、 [正直|しょうじき] な [暮|くら]し を する つもり です"
  fr: "Quoi que je devienne, je compte mener une vie humaine et honnête."
  en: "Whatever I become, I intend to live an honest, human life."
- id: q021
  author: 夏目漱石
  authorLatin: Natsume Sōseki
  work: "草枕"
  year: 1906
  source: https://www.aozora.gr.jp/cards/000148/card776.html
  text: "山路を登りながら、こう考えた。"
  ruby: "[山路|やまみち] を [登|のぼ]り ながら 、 こう [考|かんが]え た 。"
  fr: "En gravissant le sentier de montagne, je réfléchissais ainsi."
  en: "Climbing the mountain path, I thought as follows."
- id: q022
  author: 夏目漱石
  authorLatin: Natsume Sōseki
  work: "草枕"
  year: 1906
  source: https://www.aozora.gr.jp/cards/000148/card776.html
  text: "智に働けば角が立つ。情に棹させば流される。意地を通せば窮屈だ。とかくに人の世は住みにくい。"
  ruby: "[智|ち] に [働|はたら]け ば [角|かど] が [立|た]つ 。 [情|じょう] に [棹|さお]させ ば [流|なが]さ れる 。 [意地|いじ] を [通|とお]せ ば [窮屈|きゅうくつ] だ 。 とかく に [人|ひと] の [世|よ] {は} [住|す]み にくい 。"
  fr: "Suivez la raison, et vous vous heurtez aux autres. Cédez au sentiment, et vous êtes emporté. Obstinez-vous, et vous étouffez. Bref, ce monde est difficile à vivre."
  en: "Follow reason, and you clash with others. Give way to feeling, and you are swept along. Insist on your own way, and you feel cramped. One way or another, this world is a hard place to live in."
- id: q023
  author: 夏目漱石
  authorLatin: Natsume Sōseki
  work: "草枕"
  year: 1906
  source: https://www.aozora.gr.jp/cards/000148/card776.html
  text: "住みにくさが高じると、安い所へ引き越したくなる。どこへ越しても住みにくいと悟った時、詩が生れて、画が出来る。"
  ruby: "[住|す]み にく さ が [高|こう]じる と 、 [安|やす]い [所|ところ] {へ} [引|ひ]き[越|こ]し たく なる 。 どこ {へ} [越|こ]し て も [住|す]み にくい と [悟|さと]っ た [時|とき] 、 [詩|し] が [生|うま]れ て 、 [画|え] が [出来|でき]る 。"
  fr: "Quand la vie devient trop difficile, on a envie de déménager là où elle est facile. Quand on comprend qu'elle est difficile partout, la poésie naît et la peinture vient."
  en: "When living grows too hard, one wants to move somewhere easier. On realising that it is hard everywhere, poetry is born and pictures are made."
- id: q024
  author: 夏目漱石
  authorLatin: Natsume Sōseki
  work: "吾輩は猫である"
  year: 1905
  source: https://www.aozora.gr.jp/cards/000148/card789.html
  text: "吾輩は猫である。名前はまだ無い。"
  ruby: "[吾輩|わがはい] {は} [猫|ねこ] で ある 。 [名前|なまえ] {は} まだ [無|な]い 。"
  fr: "Je suis un chat. Je n'ai pas encore de nom."
  en: "I am a cat. As yet I have no name."
- id: q025
  author: 夏目漱石
  authorLatin: Natsume Sōseki
  work: "吾輩は猫である"
  year: 1905
  source: https://www.aozora.gr.jp/cards/000148/card789.html
  text: "どこで生れたかとんと見当がつかぬ。"
  ruby: "どこ で [生|うま]れ た か とんと [見当|けんとう] が つか ぬ 。"
  fr: "Je n'ai aucune idée de l'endroit où je suis né."
  en: "I have no idea where I was born."
- id: q026
  author: 夏目漱石
  authorLatin: Natsume Sōseki
  work: "坊っちゃん"
  year: 1906
  source: https://www.aozora.gr.jp/cards/000148/card752.html
  text: "親譲りの無鉄砲で小供の時から損ばかりしている。"
  ruby: "[親譲|おやゆず]り の [無鉄砲|むてっぽう] で [小供|こども] の [時|とき] から [損|そん] ばかり し て いる 。"
  fr: "À cause de l'imprudence héritée de mes parents, je n'ai fait que perdre depuis l'enfance."
  en: "Thanks to a recklessness inherited from my parents, I have been losing out ever since I was a child."
- id: q027
  author: 夏目漱石
  authorLatin: Natsume Sōseki
  work: "こころ"
  year: 1914
  source: https://www.aozora.gr.jp/cards/000148/card773.html
  text: "精神的に向上心のないものは馬鹿だ"
  ruby: "[精神的|せいしんてき] に [向上心|こうじょうしん] の ない もの {は} [馬鹿|ばか] だ"
  fr: "Celui qui n'a pas d'ambition spirituelle est un imbécile."
  en: "Anyone with no desire for spiritual growth is a fool."
- id: q028
  author: 夏目漱石
  authorLatin: Natsume Sōseki
  work: "こころ"
  year: 1914
  source: https://www.aozora.gr.jp/cards/000148/card773.html
  text: "恋は罪悪ですよ。"
  ruby: "[恋|こい] {は} [罪悪|ざいあく] です よ 。"
  fr: "L'amour est un péché, vous savez."
  en: "Love is a sin, you know."
- id: q029
  author: 夏目漱石
  authorLatin: Natsume Sōseki
  work: "夢十夜"
  year: 1908
  source: https://www.aozora.gr.jp/cards/000148/card799.html
  text: "こんな夢を見た。"
  ruby: "こんな [夢|ゆめ] を [見|み] た 。"
  fr: "J'ai fait le rêve que voici."
  en: "I had a dream like this."
- id: q030
  author: 夏目漱石
  authorLatin: Natsume Sōseki
  work: "夢十夜"
  year: 1908
  source: https://www.aozora.gr.jp/cards/000148/card799.html
  text: "百年待っていて下さい"
  ruby: "[百|ひゃく] [年|ねん] [待|ま]っ て い て [下|くだ]さい"
  fr: "Attendez-moi cent ans."
  en: "Please wait for me for a hundred years."
- id: q031
  author: 太宰治
  authorLatin: Dazai Osamu
  work: "人間失格"
  year: 1948
  source: https://www.aozora.gr.jp/cards/000035/card301.html
  text: "恥の多い生涯を送って来ました。"
  ruby: "[恥|はじ] の [多|おお]い [生涯|しょうがい] を [送|おく]っ て [来|き] まし た 。"
  fr: "J'ai vécu une vie pleine de honte."
  en: "Mine has been a life of much shame."
- id: q032
  author: 太宰治
  authorLatin: Dazai Osamu
  work: "人間失格"
  year: 1948
  source: https://www.aozora.gr.jp/cards/000035/card301.html
  text: "ただ、一さいは過ぎて行きます。"
  ruby: "ただ 、 [一|いっ]さい {は} [過|す]ぎ て [行|い]き ます 。"
  fr: "Seulement, tout passe."
  en: "Only, everything passes."
- id: q033
  author: 太宰治
  authorLatin: Dazai Osamu
  work: "走れメロス"
  year: 1940
  source: https://www.aozora.gr.jp/cards/000035/card1567.html
  text: "メロスは激怒した。"
  ruby: "メロス {は} [激怒|げきど] し た 。"
  fr: "Melos entra dans une rage folle."
  en: "Melos was furious."
- id: q034
  author: 太宰治
  authorLatin: Dazai Osamu
  work: "走れメロス"
