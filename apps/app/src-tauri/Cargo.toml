[package]
name = "keyai"
version = "0.1.0"
description = "Learn to read Japanese kana by typing them"
authors = ["mumpkin"]
license = "MIT"
repository = "https://github.com/mumpkin/keyai"
edition = "2024"
rust-version = "1.90"

[lib]
name = "keyai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
