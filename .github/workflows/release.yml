name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Check the version
        run: |
          version="$(node --print "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          grep --quiet "^## \[$version\]" CHANGELOG.md
      - name: Vocabulary
        run: pnpm vocab:check --strict
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "keyai $version" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/app/src-tauri
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # The action finds the draft of `prepare` from its tag
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: false
          projectPath: apps/app
          tauriScript: pnpm tauri

  stable-names:
    name: Add stable download names
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The download buttons of the web app link to these names, which do
      # not change with the version.
      - name: Copy the installers under stable names
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern '*-setup.exe' --pattern '*.AppImage' --pattern '*.deb'
          cp ./*-setup.exe keyai-windows-x64-setup.exe
          cp ./*.AppImage keyai-linux-x86_64.AppImage
          cp ./*.deb keyai-linux-amd64.deb
          gh release upload "$GITHUB_REF_NAME" --clobber \
            keyai-windows-x64-setup.exe \
            keyai-linux-x86_64.AppImage \
            keyai-linux-amd64.deb
