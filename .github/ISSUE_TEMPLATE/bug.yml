name: Bug / Problème
description: Quelque chose ne marche pas dans keyai / Something does not work in keyai
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Que s'est-il passé ? / What happened?
      description: Ce que tu as vu, avec une capture si possible
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: À quoi t'attendais-tu ? / What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Comment le reproduire ? / How to reproduce it?
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
  - type: input
    id: version
    attributes:
      label: Version
      description: Dans Réglages, À propos
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Appareil / Device
      description: Site web, Windows ou Linux, et le navigateur si c'est le site
    validations:
      required: true
